name: validate

# The same gates as `task validate`, plus beatcore's Rust checks. The Python job builds
# beatcore with the runner's own Rust toolchain and installs onnxruntime, so the end-to-end
# and note-model tests run here rather than skipping. The image build is slower and runs on
# demand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install task
        run: curl -sL https://taskfile.dev/install.sh | sh -s -- -d -b /usr/local/bin

      - name: Install test and lint tooling
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet -r requirements-dev.txt \
            $(grep -E '^(Flask|Werkzeug|numpy|scipy|onnxruntime)==' app/requirements.txt) \
            ./beatcore
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: ffmpeg for the end-to-end tests
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Task tree resolves
        run: task --list-all > /dev/null

      - name: Lint
        run: task lint:check

      - name: Tests
        run: task test

      - name: Structure gates
        run: task quality:check

      - name: Compose file
        run: task docker:config

  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: beatcore
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release

  image:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker compose build
