name: validate

# The same gates as `task validate`, plus beatcore's Rust checks. The Python job builds
# beatcore with the runner's own Rust toolchain and installs onnxruntime, so the end-to-end
# and note-model tests run here rather than skipping. The image job builds app/Dockerfile
# with a GitHub Actions layer cache.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # The root Taskfile includes namespaces from the .crepidoma submodule.
          submodules: true

      # actions/setup-python v7.0.0, pinned by commit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      # astral-sh/setup-uv v10.3.0, pinned by commit
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884

      # arduino/setup-task v3.0.0, pinned by commit
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # yt-dlp too: without it, basedpyright cannot resolve the import in app/youtube.py.
      # mcp too: the MCP server tests import it, and type checking failed on CI without it.
      - name: Install test and lint tooling
        run: |
          python -m venv .venv
          # shellcheck disable=SC2046 # word splitting is the point: one pip argument per pinned line
          .venv/bin/python -m pip install --quiet -r requirements-dev.txt \
            $(grep -E '^(Flask|Werkzeug|numpy|scipy|onnxruntime|mcp)==|^yt-dlp$' app/requirements.txt) \
            ./beatcore
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: ffmpeg for the end-to-end tests
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Task tree resolves
        run: task --list-all > /dev/null

      - name: Lint
        run: task lint:python:check hostpy:check lint:yaml:check

      - name: Types
        run: task types:check

      - name: ast-grep rules
        run: task sg:check

      - name: ast-grep rule tests
        run: task sg:test

      - name: Tests
        run: task test:run

      - name: Structure gates
        run: task quality:gate

      - name: Compose file
        run: task docker:config

  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: beatcore
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release

  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1, pinned by commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # docker/setup-buildx-action v4.4.1, pinned by commit
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # docker/build-push-action v7.4.0, pinned by commit. Build only: nothing is pushed or loaded;
      # the layer cache makes later runs fast.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: app/Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
