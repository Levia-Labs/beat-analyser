version: 2

# Weekly, minor and patch updates grouped per ecosystem. Major bumps arrive as separate PRs.
updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    # A week before a new release is proposed: most compromised releases are pulled sooner.
    cooldown:
      default-days: 7
    ignore:
      # Unpinned on purpose (docs/adr/0004-yt-dlp-unpinned.md).
      - dependency-name: yt-dlp
    groups:
      pip-app:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # A week before a new release is proposed: most compromised releases are pulled sooner.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: yt-dlp
    groups:
      pip-dev:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /beatcore
    schedule:
      interval: weekly
    # A week before a new release is proposed: most compromised releases are pulled sooner.
    cooldown:
      default-days: 7
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # A week before a new release is proposed: most compromised releases are pulled sooner.
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    # A week before a new release is proposed: most compromised releases are pulled sooner.
    cooldown:
      default-days: 7
    groups:
      docker:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A week before a new release is proposed: most compromised releases are pulled sooner.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types: [minor, patch]
