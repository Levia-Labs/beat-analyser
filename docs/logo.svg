<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">beat-analyser: a waveform turned into kick, snare and hi-hat events</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Audio in: a waveform -->
  <g fill="url(#wave)">
    <rect x="16" y="54" width="6" height="20" rx="3"/>
    <rect x="26" y="42" width="6" height="44" rx="3"/>
    <rect x="36" y="32" width="6" height="64" rx="3"/>
    <rect x="46" y="46" width="6" height="36" rx="3"/>
    <rect x="56" y="38" width="6" height="52" rx="3"/>
  </g>
  <!-- The playhead between signal and events -->
  <line x1="71" y1="28" x2="71" y2="100" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
  <!-- Events out: hi-hat, snare and kick lanes -->
  <g fill="#ffffff" fill-opacity="0.15">
    <circle cx="84" cy="64" r="4.5"/>
    <circle cx="108" cy="64" r="4.5"/>
    <circle cx="96" cy="86" r="5.5"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="84" cy="42" r="3.5"/>
    <circle cx="96" cy="42" r="3.5"/>
    <circle cx="108" cy="42" r="3.5"/>
  </g>
  <circle cx="96" cy="64" r="4.5" fill="#a78bfa"/>
  <g fill="#f472b6">
    <circle cx="84" cy="86" r="5.5"/>
    <circle cx="108" cy="86" r="5.5"/>
  </g>
</svg>
