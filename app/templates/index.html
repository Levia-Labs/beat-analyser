<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beat Analyzer</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="{{ url_for('static', filename='app.css') }}" rel="stylesheet" />
  </head>
  <body>
    <main class="page">
      <h1 class="text-center my-4">Beat Analyzer</h1>

      <form id="uploadForm" class="card p-4 mb-4 shadow-sm rounded">
        <div class="mb-3">
          <label for="file" class="form-label">Audio file</label>
          <input
            class="form-control"
            type="file"
            id="file"
            name="file"
            accept="{{ accept }}"
            required
          />
        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-accent">Process file</button>
        </div>
      </form>

      <form id="ytForm" class="card p-4 mb-4 shadow-sm rounded">
        <div class="mb-3">
          <label for="ytUrl" class="form-label">YouTube URL</label>
          <input
            type="url"
            class="form-control"
            id="ytUrl"
            placeholder="https://www.youtube.com/watch?v=..."
            required
          />
        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-accent">Process YouTube</button>
        </div>
      </form>

      <h2 class="mb-3 text-center">Results</h2>
      <div class="accordion mb-5" id="foldersAccordion"></div>
    </main>

    <div class="modal fade" id="loadingModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center p-3">
          <div class="modal-body">
            <p class="mb-0">Processing, please wait...</p>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
