# Commit-time gates: seconds, read-only. Install with `task precommit:setup`.
# The local hooks call this repository's own tasks, so "linted" has one definition shared by
# the hook, CI and a person running `task validate`.

repos:
  - repo: local
    hooks:
      - id: lint
        name: ruff and yamllint
        entry: task lint:check
        language: system
        pass_filenames: false
        files: \.(py|ya?ml)$

      - id: types
        name: basedpyright
        entry: task types:check
        language: system
        pass_filenames: false
        files: \.py$|^pyrightconfig\.json$

      - id: ast-grep
        name: ast-grep rules
        entry: task sg:check
        language: system
        pass_filenames: false
        files: \.(py|html)$|^tasks/sg/|^sgconfig\.yml$

      - id: ast-grep-tests
        name: ast-grep rule tests
        entry: task sg:test
        language: system
        pass_filenames: false
        files: ^tasks/sg/|^sgconfig\.yml$

      - id: tests
        name: pytest
        entry: task test
        language: system
        pass_filenames: false
        files: ^(app|tests)/

      - id: structure
        name: documentation paths and file length
        entry: task quality:check
        language: system
        pass_filenames: false
        files: \.(py|ya?ml|md|html|js|css)$

  # Secrets in staged changes. pre-commit installs the Go toolchain the hook needs.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]
