# Project-local RTK filters. Only success noise is stripped: a failing line never matches,
# so an agent still reads every error. Applied only after `rtk trust` on each machine.
schema_version = 1

[filters.task-validate]
description = "Collapse a clean task validate"
match_command = "^task\\s+(validate|style:check|quality:check|types:check|sg:check|sg:test|test)\\b"
strip_lines_matching = [
  "^All checks passed!$",
  "^\\d+ files? already formatted$",
  "known finding\\(s\\), none new\\.$",
  "none new, none grown\\.$",
  # pytest progress: dots, s for a skip, a padded percentage ("[ 33%]"). F and E never match.
  "^[.s]+\\s+\\[\\s*\\d+%\\]$",
  "^every task has an allow rule",
  "docker-compose.yml valid$",
  # basedpyright and ast-grep test on success.
  "^0 errors, 0 warnings, 0 notes$",
  "^Running \\d+ tests$",
  "^-+ Case Details -+$",
  "^PASS \\S+\\s+\\.+$",
  "^test result: ok\\. \\d+ passed; 0 failed;$",
  "no file below its baseline$",
  "^$",
]
on_empty = "validate: ok"
