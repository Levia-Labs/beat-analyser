version: "3"

silent: true

# beat-analyser: audio in, timed percussion and note events out.
#
# FIRST TIME
#   task setup                   virtualenv, dependencies, git hooks
#   task doctor                  what is installed and what is missing. Changes nothing.
#
# EVERY DAY
#   task analyse FILE=song.mp3   analyse one local file, print a per-track summary
#   task test:run                the test suite (no madmom needed)
#   task validate                every offline gate - what the hooks and the Stop hook run
#   task validate:deep           validate plus coverage, deep properties, security audits
#   task run                     the web UI on http://127.0.0.1:5000 (development server)
#   task docker:up               the same UI in the container on http://localhost:8002
#
# `task --list` is the index; every task carries a `desc`. docs/tasks.md explains each one.

vars:
  # The project virtualenv's interpreter. Windows and Linux lay a venv out differently.
  PY: '{{if eq OS "windows"}}.venv/Scripts/python.exe{{else}}.venv/bin/python{{end}}'
  # The interpreter that creates the venv. Windows has no real `python3` (a Store stub).
  SYS_PY: '{{if eq OS "windows"}}python{{else}}python3{{end}}'
  ROOT: '{{.ROOT | default "uploads"}}'
  # The virtualenv's scripts folder, for tools that ship a binary (ast-grep).
  BIN: '{{if eq OS "windows"}}.venv/Scripts{{else}}.venv/bin{{end}}'

includes:
  deps:
    taskfile: ./tasks/deps/Taskfile.yml
    vars: { PY: "{{.PY}}", SYS_PY: "{{.SYS_PY}}" }
  dev:
    taskfile: ./tasks/dev/Taskfile.yml
    vars: { SYS_PY: "{{.SYS_PY}}" }
  docker:
    taskfile: ./tasks/docker/Taskfile.yml
    vars: { SYS_PY: "{{.SYS_PY}}" }
  rust: ./tasks/rust/Taskfile.yml
  eval: ./tasks/eval/Taskfile.yml
  coverage:
    taskfile: ./tasks/coverage/Taskfile.yml
    vars: { PY: "{{.PY}}" }
  types:
    taskfile: ./tasks/types/Taskfile.yml
    vars: { PY: "{{.PY}}" }
  sg:
    taskfile: ./tasks/sg/Taskfile.yml
    vars: { BIN: "{{.BIN}}" }
  uploads:
    taskfile: ./tasks/uploads/Taskfile.yml
    vars: { PY: "{{.PY}}", ROOT: "{{.ROOT}}" }

  # Shared namespaces from the Crepidoma submodule. Root configs (ruff.toml, .yamllint,
  # pyrightconfig.json, sgconfig.yml, .gitleaks.toml) reach them through include vars.
  claude: .crepidoma/taskfiles/claude
  lint:
    taskfile: .crepidoma/taskfiles/lint
    vars:
      LINT_CFG: "{{.ROOT_DIR}}"
      # The versions pinned in requirements-dev.txt, not whatever uvx resolves.
      LINT_RUFF: '"{{.PY}}" -m ruff'
      LINT_YAMLLINT: '"{{.PY}}" -m yamllint'
  git: .crepidoma/taskfiles/git
  quality:
    taskfile: .crepidoma/taskfiles/quality
    vars: { QUALITY_CONFIGS: "{{.ROOT_DIR}}" }
  security: .crepidoma/taskfiles/security
  test: .crepidoma/taskfiles/test
  setup: .crepidoma/taskfiles/setup
  repo: .crepidoma/taskfiles/repo
  todo: .crepidoma/taskfiles/todo
  graph: .crepidoma/taskfiles/graph
  ci: .crepidoma/taskfiles/ci
  rtk: .crepidoma/taskfiles/rtk

  # Optional tooling. Nothing above needs these.
  graphify: ./tasks/graphify/Taskfile.yml
  web: ./tasks/web/Taskfile.yml

tasks:
  default:
    desc: Show the task index
    cmds:
      - task --list

  setup:
    desc: Make this clone ready to work on - virtualenv, dependencies, git hooks
    cmds:
      - task: deps:setup
      - task: setup:hooks
      - task: doctor

  doctor:
    desc: Report every tool and dependency this project needs. Changes nothing.
    cmds:
      - |
        probe() { if command -v "$1" > /dev/null 2>&1; then printf '  %-10s ok\n' "$1"; else printf '  %-10s MISSING  %s\n' "$1" "$2"; fi; }
        echo "== tools"
        probe "{{.SYS_PY}}" "install Python 3.14"
        probe ffmpeg "decodes mp3/flac/ogg/m4a and YouTube audio"
        probe docker "only for task docker:*"
        probe ruff "task deps:setup installs it into .venv; pipx install ruff for the hooks"
        probe yamllint "pipx install yamllint"
        probe pre-commit "pipx install pre-commit"
        echo "== virtualenv"
        if [ -x "{{.PY}}" ] || [ -f "{{.PY}}" ]; then
          "{{.PY}}" -c "import flask, numpy, onnxruntime, yt_dlp, pytest; print('  imports   ok (flask, numpy, onnxruntime, yt_dlp, pytest)')" \
            || echo "  imports   FAILED - run task deps:setup"
          "{{.PY}}" -c "import basedpyright, coverage, hypothesis, pip_audit; print('  devtools  ok (basedpyright, coverage, hypothesis, pip-audit)')" \
            || echo "  devtools  MISSING - run task deps:setup"
          "{{.PY}}" -c "import beatcore; print('  beatcore  ok', beatcore.__version__)" 2>/dev/null \
            || echo "  beatcore  not built on the host - analysis tasks use the Docker image (task docker:build)"
        else
          echo "  .venv     MISSING - run task setup"
        fi

  props:deep:
    desc: Property tests at 1000 examples each (Hypothesis deep profile)
    env:
      HYPOTHESIS_PROFILE: deep
    cmds:
      - '"{{.PY}}" -m pytest tests/test_properties.py {{.CLI_ARGS}}'

  sync:
    desc: Fetch main and merge it into the current branch
    cmds:
      - git fetch origin main
      - git merge origin/main --no-edit

  # app/cli.py on the host when .venv has beatcore, otherwise in the built image - so a
  # machine without a Rust toolchain can still analyse. INPUT is a host file to mount.
  _cli:
    internal: true
    vars:
      INPUT_ABS: "{{if .INPUT}}{{if osIsAbs .INPUT}}{{.INPUT}}{{else}}{{.ROOT_DIR}}/{{.INPUT}}{{end}}{{end}}"
    cmds:
      - |
        if "{{.PY}}" -c "import beatcore; beatcore.analyse" 2> /dev/null; then
          "{{.PY}}" app/cli.py {{if .INPUT}}"{{.INPUT}}"{{end}} {{.ARGS}} --root "{{.ROOT}}"
        else
          echo "beatcore is not built on the host - running in the beat-analyser image"
          docker run --rm \
            -v "{{.ROOT_DIR}}/{{.ROOT}}:/app/uploads" \
            {{if .INPUT}}-v "{{osDir .INPUT_ABS}}:/input:ro"{{end}} \
            beat-analyser:latest python cli.py {{if .INPUT}}"/input/{{osBase .INPUT_ABS}}"{{end}} {{.ARGS}} --root /app/uploads
        fi

  analyse:
    desc: "Analyse local audio and print a per-track summary. Usage: task analyse FILE=path/to/song.mp3 [ROOT=uploads]"
    requires:
      vars: [FILE]
    cmds:
      - task: _cli
        vars: { INPUT: "{{.FILE}}" }

  analyse:yt:
    desc: "Download a YouTube video and analyse it. Usage: task analyse:yt URL=https://youtu.be/<id>"
    requires:
      vars: [URL]
    cmds:
      - task: _cli
        vars: { ARGS: '--youtube "{{.URL}}"' }

  summary:
    desc: "Events and time range per track of one analysed project. Usage: task summary NAME=song"
    requires:
      vars: [NAME]
    cmds:
      - '"{{.PY}}" app/cli.py --summary "{{.NAME}}" --root "{{.ROOT}}"'

  projects:
    desc: List analysed projects and whether each has its ZIP
    cmds:
      - '"{{.PY}}" app/cli.py --list --root "{{.ROOT}}"'

  repair:
    desc: Regenerate CSVs, meta.json and ZIP for every project from its audio.wav
    cmds:
      - task: _cli
        vars: { ARGS: "--repair" }

  run:
    desc: "Web UI on the development server. Usage: task run [PORT=5000]"
    env:
      PORT: '{{.PORT | default "5000"}}'
      UPLOAD_ROOT: "{{.ROOT}}"
    cmds:
      - '"{{.PY}}" -W ignore app/app.py'

  smoke:
    desc: "Probe a running server - index, security headers, /folders. Usage: task smoke [URL=http://127.0.0.1:5000] [TOKEN=]"
    vars:
      URL: '{{.URL | default "http://127.0.0.1:5000"}}'
    cmds:
      - '"{{.SYS_PY}}" tasks/dev/smoke.py "{{.URL}}"{{if .TOKEN}} --token "{{.TOKEN}}"{{end}}'

  gate:
    desc: 'Run tasks as gates - one line each, decisive lines on failure, full log in .cache/gate/. Usage: task gate T="rust:test,test:run -- -k notes" [LINES=30]'
    requires:
      vars: [T]
    cmds:
      - '"{{.SYS_PY}}" tasks/dev/gate.py --lines {{.LINES | default 30}}{{range $g := splitList "," .T}} "{{trim $g}}"{{end}}'

  outline:
    desc: 'Classes, functions, headings or tasks of files, with line numbers - Read only the part needed. Usage: task outline F="app/app.py docs/tasks.md"'
    requires:
      vars: [F]
    cmds:
      - '"{{.SYS_PY}}" tasks/dev/outline.py {{.F}}'

  # The shared lint passes one --config to ruff, so tasks/ruff.toml (Python 3.12: these scripts
  # run on the host's python3) is not read there. tasks/ is excluded from that run in ruff.toml
  # and linted here with its own config.
  hostpy:check:
    desc: ruff lint and format check over tasks/ at its Python 3.12 target. Changes nothing.
    cmds:
      - '"{{.PY}}" -m ruff check --config tasks/ruff.toml --output-format concise tasks'
      - '"{{.PY}}" -m ruff format --check --config tasks/ruff.toml tasks'

  hostpy:run:
    desc: ruff format and autofix over tasks/ at its Python 3.12 target
    cmds:
      - '"{{.PY}}" -m ruff format --config tasks/ruff.toml tasks'
      - '"{{.PY}}" -m ruff check --fix --config tasks/ruff.toml tasks'

  validate:
    desc: Every offline gate - task tree, lint, types, ast-grep, tests, structure, compose file. The Stop hook runs it; pre-commit and CI run its parts.
    cmds:
      - task --list-all > /dev/null
      - task: lint:python:check
      - task: hostpy:check
      - task: lint:yaml:check
      - task: test:run
      - task: web:check
      - task: quality:gate
      - task: docker:config
      # Last: on a .venv that predates them, their precondition makes the Stop hook skip
      # the rest of the run, and the gates above have already run by then.
      - task: types:check
      - task: sg:check
      - task: sg:test
      - task: claude:allow:report

  validate:deep:
    desc: validate, then coverage ratchet, deep property tests and security audits. Before a push; needs network.
    cmds:
      - task: validate
      - task: coverage:run
      - task: coverage:check
      - task: props:deep
      - task: audit:venv
      - task: security:deps
      - task: security:secrets
      - task: rust:audit
