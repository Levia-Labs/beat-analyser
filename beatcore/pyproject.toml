[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "beatcore"
version = "0.1.0"
description = "Onsets, percussion classes, tempo and beats for beat-analyser"
requires-python = ">=3.12"
license = "MIT"

[tool.maturin]
bindings = "pyo3"
features = ["python"]
module-name = "beatcore"
