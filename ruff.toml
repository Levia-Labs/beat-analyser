# ruff over app/, tasks/ and tests/. The container runs Python 3.14 (app/Dockerfile).
# Shared rules come from Crepidoma; this file adds the pillar-only settings.
extend = ".crepidoma/configs/ruff.toml"
target-version = "py314"
line-length = 100

exclude = [".venv", "graphify-out", "uploads", ".claude/skills"]

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # flake8-simplify
    "S",    # bandit - this is a network service
    "PTH",  # pathlib over os.path
    "RUF",
]

ignore = [
    # ffmpeg is called with a fixed argument list and no shell; every call site decides
    # whether a non-zero exit matters.
    "S603", "S607",
]

[lint.isort]
# The app modules import each other by bare name, the way gunicorn loads them from /app.
known-first-party = [
    "analysis", "app", "beatcore", "cli", "conftest", "key", "notes", "pipeline", "storage",
    "youtube",
]

[lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the test framework
"tasks/quality/*.py" = ["S"]
# urlopen on URLs the operator typed or fixed API hosts; fixture noise is not cryptography.
"tasks/dev/*.py" = ["S310", "S311"]
"tasks/docker/hub.py" = ["S310"]  # fixed https://hub.docker.com URLs only

[format]
quote-style = "double"
