version: "3"

# Structure gates. Both hold a committed baseline that ratchets down only: regenerating one
# records real progress and is never a way to green a failing build (docs/adr/0006).

tasks:
  check:
    desc: Every structure gate. Changes nothing.
    cmds:
      - task: docs:check
      - task: long-files:check

  docs:
    desc: Documentation findings - paths that do not resolve, scripts no README names
    cmds:
      - '"{{.SYS_PY}}" tasks/quality/docs.py'

  docs:check:
    desc: Fail on a documentation finding not in the baseline
    cmds:
      - '"{{.SYS_PY}}" tasks/quality/docs.py --check'

  docs:baseline:
    desc: Accept the current documentation findings as the ceiling
    cmds:
      - '"{{.SYS_PY}}" tasks/quality/docs.py --update-baseline'

  long-files:
    desc: Files at or over 300 lines
    cmds:
      - '"{{.SYS_PY}}" tasks/quality/long_files.py'

  long-files:top:
    desc: 'Longest files and their headroom. Usage: task quality:long-files:top [N=20]'
    cmds:
      - '"{{.SYS_PY}}" tasks/quality/long_files.py --top {{.N | default 20}}'

  long-files:check:
    desc: Fail when a file crosses 300 lines or grows past its baseline
    cmds:
      - '"{{.SYS_PY}}" tasks/quality/long_files.py --check'

  long-files:baseline:
    desc: Accept the current file lengths as the ceiling
    cmds:
      - '"{{.SYS_PY}}" tasks/quality/long_files.py --update-baseline'

  coverage:check:
    desc: Fail when a file's coverage falls below the baseline (run task test:cov first)
    cmds:
      # The venv interpreter: the gate checks which optional tools (onnxruntime, beatcore)
      # the tests could import.
      - '"{{.PY}}" tasks/quality/coverage.py --check'

  coverage:baseline:
    desc: Accept the current coverage as the floor (run task test:cov first)
    cmds:
      - '"{{.PY}}" tasks/quality/coverage.py --update-baseline'
