version: "3"

# The networked and slow security checks, run by task validate:deep. ruff's S rules (bandit)
# and the gitleaks pre-commit hook (staged changes only) cover the fast path.

vars:
  # Same version as the pre-commit hook in .pre-commit-config.yaml.
  SECURITY_GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.0

tasks:
  deps:
    desc: Known vulnerabilities in the packages installed in .venv (pip-audit; needs network)
    preconditions:
      - sh: '"{{.PY}}" -c "import pip_audit"'
        msg: pip-audit is not in .venv - run task deps:setup
    cmds:
      - '"{{.PY}}" -m pip_audit --progress-spinner off --skip-editable'

  secrets:
    desc: Secrets anywhere in the git history (gitleaks, in its image)
    cmds:
      # Not `pre-commit run gitleaks --all-files`: that hook scans the staged diff only and
      # ignores the file list, so with nothing staged it passed without scanning anything.
      - 'docker run --rm -v "{{.ROOT_DIR}}:/repo" {{.SECURITY_GITLEAKS_IMAGE}} git /repo --redact --no-banner'
