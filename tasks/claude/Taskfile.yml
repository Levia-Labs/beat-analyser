version: "3"

# Claude Code: usage budget and plugins. Nothing else in this repository needs the CLI.
# The hooks wired in .claude/settings.json are hooks.py; budget.py is vendored from the
# toolkit repository.

includes: { skills: ./skills.yml }

tasks:
  budget:
    desc: 'Usage windows against a ceiling. Exit 0 under, 3 over, 1 unknown. Usage: task claude:budget [CEILING=95]'
    cmds:
      - '"{{.SYS_PY}}" tasks/claude/budget.py --ceiling {{.CEILING | default 95}}'

  resume:
    desc: 'Block until the five-hour window is fresh. Usage: task claude:resume [CEILING=20]'
    cmds:
      - '"{{.SYS_PY}}" tasks/claude/budget.py --wait --window five_hour --ceiling {{.CEILING | default 20}}'

  history:
    desc: 'What this project''s sessions ran, and what repeats without a task. Usage: task claude:history [TOP=25]'
    cmds:
      - '"{{.SYS_PY}}" tasks/claude/history.py {{if .TOP}}--top {{.TOP}}{{end}}'

  history:prompts:
    desc: Session commands the allowlist does not cover - each one was an approval prompt
    cmds:
      - '"{{.SYS_PY}}" tasks/claude/history.py --prompts'

  history:inline:
    desc: Ad-hoc python one-liners the sessions ran - each one is a script not yet written
    cmds:
      - '"{{.SYS_PY}}" tasks/claude/history.py --inline'

  tokens:
    desc: 'Tokens per session and subagent, largest first. Usage: task claude:tokens [SESSION=id-prefix] [PROJECT=path] [TOP=15]'
    cmds:
      - '"{{.SYS_PY}}" tasks/claude/tokens.py --top {{.TOP | default 15}}{{if .SESSION}} --session {{.SESSION}}{{end}}{{if .PROJECT}} --project "{{.PROJECT}}"{{end}}'

  tokens:tools:
    desc: 'Tool result characters fed back to the model, by tool. Usage: task claude:tokens:tools [SESSION=] [PROJECT=]'
    cmds:
      - '"{{.SYS_PY}}" tasks/claude/tokens.py --tools --top {{.TOP | default 15}}{{if .SESSION}} --session {{.SESSION}}{{end}}{{if .PROJECT}} --project "{{.PROJECT}}"{{end}}'

  tokens:agents:
    desc: 'Subagents by tokens spent, with their type and description. Usage: task claude:tokens:agents [PROJECT=]'
    cmds:
      - '"{{.SYS_PY}}" tasks/claude/tokens.py --agents --top {{.TOP | default 15}}{{if .SESSION}} --session {{.SESSION}}{{end}}{{if .PROJECT}} --project "{{.PROJECT}}"{{end}}'

  tokens:reads:
    desc: 'Files Read most, with characters fed back: each top row wants a summarising task. Usage: task claude:tokens:reads [SESSION=] [PROJECT=]'
    cmds:
      - '"{{.SYS_PY}}" tasks/claude/tokens.py --reads --top {{.TOP | default 15}}{{if .SESSION}} --session {{.SESSION}}{{end}}{{if .PROJECT}} --project "{{.PROJECT}}"{{end}}'

  lanes:
    desc: Subagent lanes in use against the limit of 6, with their age
    cmds:
      - '"{{.SYS_PY}}" tasks/claude/lanes.py'

  lanes:reset:
    desc: Forget every lane - for lanes a crashed session left behind
    cmds:
      - '"{{.SYS_PY}}" tasks/claude/lanes.py --reset'

  allow:sync:
    desc: Slim .claude/settings.json to Bash(task *), twin task denies with rtk, wire the lane hooks. Run by a person - agents are denied it.
    cmds:
      - '"{{.SYS_PY}}" tasks/claude/allow_tasks.py'

  allow:check:
    desc: Fail on a redundant or dead permission rule, a deny without its rtk twin, or an unwired lane hook. Changes nothing.
    cmds:
      - '"{{.SYS_PY}}" tasks/claude/allow_tasks.py --check'

  allow:report:
    desc: The allow:check findings, never failing. What task validate runs.
    cmds:
      - '"{{.SYS_PY}}" tasks/claude/allow_tasks.py --check --warn'

  hooks:check:
    desc: Run the Stop hook by hand - validates if an edit marked the tree dirty
    cmds:
      - echo '{}' | "{{.SYS_PY}}" tasks/claude/hooks.py stop
