version: "3"

# The git hooks. What they run is .pre-commit-config.yaml, which calls this repository's own
# tasks rather than re-declaring the tools.

vars:
  PRECOMMIT:
    sh: command -v pre-commit 2>/dev/null || printf '%s' "${PIPX_BIN_DIR:-$HOME/.local/bin}/pre-commit"

tasks:
  setup:
    desc: Register the git hooks for this clone (pre-commit comes from pipx or .venv)
    cmds:
      - |
        if ! "{{.PRECOMMIT}}" --version > /dev/null 2>&1; then
          echo "pre-commit not found. Install it: pipx install pre-commit"
          exit 1
        fi
      - '"{{.PRECOMMIT}}" install'

  run:
    desc: Run every hook over every file
    cmds:
      - '"{{.PRECOMMIT}}" run --all-files'

  staged:
    desc: Run the hooks over the staged files only
    cmds:
      - '"{{.PRECOMMIT}}" run'

  autoupdate:
    desc: Bump the pinned revisions of the third-party hooks
    cmds:
      - '"{{.PRECOMMIT}}" autoupdate'
