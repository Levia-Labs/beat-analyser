version: "3"

# The container: docker-compose.yml at the repository root, image built from app/.
# The first build compiles madmom and takes a long time; later builds reuse the dependency
# layer unless app/requirements.txt changes.

tasks:
  build:
    desc: Build the image (the first build is slow - madmom compiles from source)
    cmds:
      - docker compose build

  rebuild:
    desc: Build without cache - picks up a new yt-dlp release
    cmds:
      - docker compose build --no-cache

  up:
    desc: "Start the service and its MCP endpoint in the background. Usage: task docker:up [PORT=80] [MCP_PORT=8001] [BIND=127.0.0.1]"
    cmds:
      - docker compose up -d --build
      - echo "http://localhost:${PORT:-80}  (task docker:logs to follow)"
      - echo "MCP  http://localhost:${MCP_PORT:-8001}/mcp  (docs/mcp.md)"

  down:
    desc: Stop and remove the container. uploads/ on the host is kept.
    cmds:
      - docker compose down

  logs:
    desc: Follow the container logs
    cmds:
      - docker compose logs -f --tail 100

  ps:
    desc: Container state and health
    cmds:
      - docker compose ps

  shell:
    desc: Open a shell inside the running container
    cmds:
      - docker compose exec backend sh

  config:
    desc: Validate docker-compose.yml. Skipped when docker is not installed.
    cmds:
      - |
        if command -v docker > /dev/null 2>&1; then
          docker compose config --quiet && echo "docker-compose.yml valid"
        else
          echo "docker not installed - compose check skipped"
        fi

  size:
    desc: Size of the built image
    cmds:
      - docker images beat-analyser

  hub:check:
    desc: Compare the Docker Hub page with tasks/docker/hub.md. Changes nothing.
    cmds:
      - '"{{.SYS_PY}}" tasks/docker/hub.py'

  # Publishes to Docker Hub: run by a person, denied to agents like docker push.
  hub:publish:
    desc: "Publish tasks/docker/hub.md as the Docker Hub page. Uses the docker login credentials, or DOCKERHUB_USERNAME and DOCKERHUB_TOKEN"
    cmds:
      - '"{{.SYS_PY}}" tasks/docker/hub.py --apply'

  e2e:
    desc: "Build, start on spare ports, run task dev:e2e and dev:mcp:e2e against it, stop. Usage: task docker:e2e [PORT=8099] [MCP_PORT=8098]"
    vars:
      PORT: '{{.PORT | default "8099"}}'
      MCP_PORT: '{{.MCP_PORT | default "8098"}}'
    env:
      PORT: "{{.PORT}}"
      MCP_PORT: "{{.MCP_PORT}}"
    cmds:
      - defer: docker compose down
      # --wait blocks until both healthchecks pass, so no sleep and no retry loop.
      - docker compose up -d --build --wait
      - task: :dev:e2e
        vars: { URL: "http://127.0.0.1:{{.PORT}}" }
      - task: :summary
        vars: { NAME: fixture-e2e }
      # After the summary: dev:mcp:e2e clears fixture projects before its own run.
      - task: :dev:mcp:e2e
        vars: { URL: "http://127.0.0.1:{{.MCP_PORT}}/mcp" }
      - docker images beat-analyser --format "image {{"{{"}}.Size{{"}}"}}"
