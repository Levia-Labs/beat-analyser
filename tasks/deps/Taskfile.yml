version: "3"

# The project virtualenv, .venv/. The container builds its own (app/Dockerfile); this one is
# for running the app, the CLI and the tests on the host.

tasks:
  setup:
    desc: Create .venv if missing, install app and dev dependencies, and beatcore when Rust is present
    cmds:
      - |
        if [ ! -f "{{.PY}}" ]; then
          "{{.SYS_PY}}" -m venv .venv
        fi
      - '"{{.PY}}" -m pip install --quiet --upgrade pip'
      - '"{{.PY}}" -m pip install --quiet -r app/requirements.txt -r requirements-dev.txt'
      - task: beatcore

  beatcore:
    desc: Build and install the beatcore Rust extension into .venv (needs a host Rust toolchain)
    cmds:
      - |
        if command -v cargo > /dev/null 2>&1; then
          "{{.PY}}" -m pip install --quiet ./beatcore && echo "beatcore installed into .venv"
        else
          echo "No host Rust toolchain: beatcore not built into .venv."
          echo "Analysis tasks fall back to the Docker image (task docker:build)."
        fi

  check:
    desc: Broken requirements and outdated packages in .venv. Changes nothing.
    cmds:
      - '"{{.PY}}" -m pip check'
      - '"{{.PY}}" -m pip list --outdated'

  yt-dlp:
    desc: Upgrade yt-dlp in .venv - the fix when YouTube downloads start failing
    cmds:
      - '"{{.PY}}" -m pip install --quiet --upgrade yt-dlp'
      - '"{{.PY}}" -m yt_dlp --version'
