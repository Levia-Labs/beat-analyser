version: "3"

# Scoring beatcore against ground truth (tasks/eval/eval.py). Runs in the app image, where
# beatcore is built: `task docker:build` first after changing the crate.

# Prefixed: go-task merges every included Taskfile's top-level vars into one scope, and an
# unprefixed RUN here was silently replaced by tasks/rust/'s.
vars:
  EVAL_RUN: >-
    docker run --rm
    -v "{{.ROOT_DIR}}/tasks/eval:/eval:ro"
    beat-analyser:latest

tasks:
  synthetic:
    desc: 'Tempo, beat and onset scores on generated clips with known truth. Usage: task eval:synthetic [SECONDS=20]'
    cmds:
      - '{{.EVAL_RUN}} python /eval/eval.py synthetic --seconds {{.SECONDS | default 20}}'

  # The tuning loop: change beatcore, task docker:build, then diff. Scores live in
  # .cache/eval/ (gitignored), mounted writable; the scripts stay read-only.
  synthetic:diff:
    desc: 'Mean scores with their change, and only the clips that moved, against the saved baseline. Usage: task eval:synthetic:diff [THRESHOLD=0.05] [SECONDS=20]'
    cmds:
      - mkdir -p .cache/eval
      - >-
        docker run --rm
        -v "{{.ROOT_DIR}}/tasks/eval:/eval:ro"
        -v "{{.ROOT_DIR}}/.cache/eval:/out"
        beat-analyser:latest
        python /eval/eval.py synthetic --seconds {{.SECONDS | default 20}}
        --save /out/synthetic-latest.json --baseline /out/synthetic-baseline.json
        --threshold {{.THRESHOLD | default 0.05}}

  synthetic:baseline:
    desc: Accept the last eval:synthetic:diff run as the baseline later diffs compare with
    preconditions:
      - sh: test -f .cache/eval/synthetic-latest.json
        msg: No run to accept. Run task eval:synthetic:diff first.
    cmds:
      - cp .cache/eval/synthetic-latest.json .cache/eval/synthetic-baseline.json
      - echo "baseline saved"

  dir:
    desc: 'Tempo and beat scores on a folder of audio with .beats annotations (Ballroom format). Usage: task eval:dir DIR=path'
    requires:
      vars: [DIR]
    cmds:
      - >-
        docker run --rm
        -v "{{.ROOT_DIR}}/tasks/eval:/eval:ro"
        -v "{{if osIsAbs .DIR}}{{.DIR}}{{else}}{{.ROOT_DIR}}/{{.DIR}}{{end}}:/data:ro"
        beat-analyser:latest
        python /eval/eval.py /data
