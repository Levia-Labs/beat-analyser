version: "3"

# Development helpers. Each wraps a script in this folder so that an operation done once by
# hand becomes one allowlisted `task` call in every later session, with no approval prompt.
# Fixtures go to .cache/fixtures/ (gitignored).

vars:
  DEV_FIXTURES: .cache/fixtures
  # The venv interpreter, not inherited PY: an include's vars are passed explicitly (rule3).
  DEV_PY: '{{if eq OS "windows"}}.venv/Scripts/python.exe{{else}}.venv/bin/python{{end}}'
  # Newest installed superpowers version's SDD scripts; empty when the plugin is missing.
  DEV_SDD:
    sh: printf '%s\n' "$HOME"/.claude/plugins/cache/claude-plugins-official/superpowers/*/skills/subagent-driven-development/scripts | sort -V | tail -n 1

tasks:
  fixture:
    desc: "Synthetic clip with known kicks, hats and an A4 note (WAV and MP3). Usage: task dev:fixture [NAME=fixture-demo] [SECONDS=4] [BPM=120]"
    vars:
      NAME: '{{.NAME | default "fixture-demo"}}'
    cmds:
      - '"{{.SYS_PY}}" tasks/dev/fixture.py "{{.DEV_FIXTURES}}/{{.NAME}}.wav" --seconds {{.SECONDS | default 4}} --bpm {{.BPM | default 120}} --mp3'

  e2e:
    desc: "Upload a fixture to a running server and check ZIP, CSRF and URL refusals. Usage: task dev:e2e [URL=http://127.0.0.1:5000]"
    cmds:
      # A cached ZIP from the last run would be served without analysis, and the check
      # would pass on stale output. Fixture projects only; nothing else is touched.
      - task: :uploads:fixtures:clean
      - task: fixture
        vars: { NAME: fixture-e2e }
      - '"{{.SYS_PY}}" tasks/dev/e2e.py "{{.DEV_FIXTURES}}/fixture-e2e.mp3" --url "{{.URL | default "http://127.0.0.1:5000"}}"'

  mcp:e2e:
    desc: "Analyse a fixture through a running MCP service and check status, events and a refusal. Usage: task dev:mcp:e2e [URL=http://127.0.0.1:8001/mcp] [TOKEN=]"
    cmds:
      # A cached ZIP would make the project done at once, and the check would pass on stale
      # output. Fixture projects only; nothing else is touched.
      - task: :uploads:fixtures:clean
      - task: fixture
        vars: { NAME: fixture-mcp }
      - '"{{.SYS_PY}}" tasks/dev/mcp_e2e.py "{{.DEV_FIXTURES}}/fixture-mcp.mp3" --url "{{.URL | default "http://127.0.0.1:8001/mcp"}}"{{if .TOKEN}} --token "{{.TOKEN}}"{{end}}'

  encoding:
    desc: List tracked text files that are not UTF-8 without a BOM. Changes nothing.
    cmds:
      - '"{{.SYS_PY}}" tasks/dev/encoding.py'

  encoding:fix:
    desc: Rewrite non-UTF-8 tracked text files as UTF-8, no BOM, LF
    cmds:
      - '"{{.SYS_PY}}" tasks/dev/encoding.py --fix'

  basic-pitch:
    desc: "Fetch basic-pitch's ONNX model and licence from its PyPI wheel, sha256-verified. Usage: task dev:basic-pitch [VERSION=0.4.0]"
    cmds:
      - '"{{.SYS_PY}}" tasks/dev/basic_pitch.py --version {{.VERSION | default "0.4.0"}}'

  sdd:workspace:
    desc: "Print the SDD workspace directory of a plan (superpowers plugin). Usage: task dev:sdd:workspace PLAN=docs/plan.md"
    requires: { vars: [PLAN] }
    preconditions:
      - sh: test -d "{{.DEV_SDD}}"
        msg: "superpowers plugin not installed: no subagent-driven-development scripts under ~/.claude/plugins/cache"
    cmds:
      - bash "{{.DEV_SDD}}/sdd-workspace" "{{.PLAN}}"

  sdd:brief:
    desc: "Extract task N of a plan into a brief file and print its path. Usage: task dev:sdd:brief PLAN=docs/plan.md N=3"
    requires: { vars: [PLAN, N] }
    preconditions:
      - sh: test -d "{{.DEV_SDD}}"
        msg: "superpowers plugin not installed: no subagent-driven-development scripts under ~/.claude/plugins/cache"
    cmds:
      - bash "{{.DEV_SDD}}/task-brief" "{{.PLAN}}" "{{.N}}"

  sdd:review:
    desc: "Write the review package (commits, stat, diff) for FROM..TO and print its path. Usage: task dev:sdd:review PLAN=docs/plan.md FROM=<sha> [TO=HEAD]"
    requires: { vars: [PLAN, FROM] }
    preconditions:
      - sh: test -d "{{.DEV_SDD}}"
        msg: "superpowers plugin not installed: no subagent-driven-development scripts under ~/.claude/plugins/cache"
    cmds:
      - bash "{{.DEV_SDD}}/review-package" "{{.PLAN}}" "{{.FROM}}" "{{.TO | default "HEAD"}}"

  pyapi:
    desc: "Signature and first docstring line of a Python attribute, or a module's public names (venv, .venv is invisible to ripgrep). Usage: task dev:pyapi -- module[:attr.path] ..."
    silent: true
    cmds:
      - '"{{.DEV_PY}}" tasks/dev/pyapi.py {{.CLI_ARGS}}'

  commit:
    desc: 'Commit exactly the given paths, retrying once when hooks reformat them; never pushes. Usage: task dev:commit [COAUTHOR="Name <email>"] -- "<message>" path [path...]'
    cmds:
      - '"{{.DEV_PY}}" tasks/dev/commit.py {{if .COAUTHOR}}--coauthor "{{.COAUTHOR}}"{{end}} {{.CLI_ARGS}}'

  packages:
    desc: 'GitHub stars, PyPI and crates.io status of libraries. Usage: task dev:packages GITHUB="owner/repo" PYPI="pkg" CRATES="crate"'
    cmds:
      - '"{{.SYS_PY}}" tasks/dev/packages.py {{if .GITHUB}}--github {{.GITHUB}}{{end}} {{if .PYPI}}--pypi {{.PYPI}}{{end}} {{if .CRATES}}--crates {{.CRATES}}{{end}}'
